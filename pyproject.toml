[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-joystick"
version = "0.1.0"
description = "Remote joystick streaming over Tailscale for Windows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.7.0; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-qt>=4.3.0",
  "hypothesis>=6.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "pre-commit>=3.0.0",
]

[project.scripts]
remote-joystick = "remote_joystick.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true

[tool.coverage.run]
source = ["src/remote_joystick"]
